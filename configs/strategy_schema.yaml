#     비율 0.6~0.8인 문서가 "이미 최고 수준"으로 처방에서 빠졌다(미니 비교 dev 194개 중 38개, 그중 92%가 비율 1.0 미만).
#     수준은 다른 continuous 축과 같이 가장 가까운 0 / 0.5 / 1.0(경계 0.25, 0.75; v0.7에서 0.3 / 0.9로 바뀜)이다. Rewriter 문장은 그대로다.
#   - body_query_alignment(#11)는 그대로 분위수다(루브릭이 "질의의 핵심을 다룬다"는 의미 수준이고 코사인을 섞는다).
