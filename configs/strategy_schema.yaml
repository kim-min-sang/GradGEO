#   - body_query_alignment (a)와 structural_query_alignment의 "질의 핵심어 등장 비율"을 핵심어마다 IDF 가중으로 센다
#     (가중치 = 검색 색인(passage 단위, C29)의 BM25 idf, 드문 단어일수록 크다). 같은 개수만 세면 "what" 같은 흔한 질의 단어가
#     "deficiency" 같은 핵심 단어와 같은 몫을 받는다. 무료 축 R head 시험(검증 질의 270개): 질의 안 AUC 0.80 → 0.87.
#     Rewriter 문장은 그대로다.
