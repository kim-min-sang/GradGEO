# GradGEO 전략 스키마 — v0.11 (2026-11-13, 작성 중)
#
# z ∈ [0,1]^20 후보 축의 정의. 축 번호(#1~#20)는 핸드오프 §5.1 표 번호이고 이 파일의 나열 순서와 다르다.
# z의 인덱스는 코드가 id 목록으로 정한다(예: experiments/r_head_free.py AXES).
# 20개는 "후보 풀"이다. 정제 절차(refinement)를 데이터에 적용해 최종 K ≤ 12로 줄인다.
#
# 영어 문장이 판정 LLM과 Rewriter 프롬프트에 그대로 들어가는 정본이다(코퍼스가 영어).
# 한국어는 바로 위 주석으로 단 검토용 번역이다. 이전 판: configs/archive/strategy_schema_v0.10.yaml, v0.9.yaml, v0.8.yaml, v0.7.yaml, v0.4.yaml, v0.3.yaml, v0.2.yaml
# 파이프라인 쪽 결정(학습 단위, 레이블, 대표 passage, 재작성 범위, 비교 방법)은 docs/GradGEO_Handoff_v2.2_2026-11-05.md
#
# v0.11 수정 (2026-11-13, 작성 중) — 미니 시험(gpt-5.4-mini)에서 처방 수준에 못 미친 축의 Rewriter 문장
#   - unique_words(#8) 내리기(사용자 확정): 56건 중 3건만 도달, Rewriter가 오히려 동의어로 바꿔 씀(records → documentation).
#     목표 문장 0.0을 중립적으로("쉽고 일관된 표현"), safety_down 허용·금지를 구체적으로, 공통 규칙의 반복 금지에는
#     "같은 대상 같은 단어"만 좁은 예외(질의어 반복은 여전히 금지), lower_floor 0.5(1.0 → 0.5만).
#
# v0.10 수정 (2026-11-12 사용자 확정, 핸드오프 C37)
#   - 처방 방향(direction): 축마다 up(올리기만) 또는 both(양방향). 기준은 두 질문 — 내리려면 이미 있는 사실을 지워야 하나
#     (global_safety 첫 규칙, GEO·SAGEO 프롬프트에도 같은 규칙이 있다), 내린 상태가 망가진 문서인가. 둘 다 아니면 both.
#     up 9개: statistics, cite_sources, concrete_claims, jsonld(사실 삭제) / fluency, chunk_independence, body_query_alignment,
#     structural_query_alignment, heading_hierarchy(망가짐). both 11개: 나머지. title_informativeness는 0.75, meta_description은
#     0.5 아래로 내리지 않는다(lower_floor). head 학습은 방향과 무관하고, 처방(optimization/gradient_strategy.py)만 거른다.
#   - 내릴 때의 허용·금지(safety_down)를 both 축에 더했다. Rewriter는 목표가 현재보다 낮으면 safety 대신 이것을 본다.
#   - 가시성 마스크(hidden_from): 그 단계 입력에 아예 안 보이는 축은 그 단계 head 입력에서 뺀다.
#     heading_hierarchy: R·K(BM25 색인과 재정렬기 입력은 헤딩 태그를 지운다), emphasis: R(BM25 분석기가 *를 버린다).
#     R head(무료 축)에서 둘을 빼도 검증 질의 안 AUC 0.8825 → 0.8820. R head 기울기는 미니 타깃 194개 모두에서
#     heading_hierarchy를 내리라고 가리켰다(보이지 않는 축에 붙은 상관).
#
# v0.9 수정 (2026-11-12 사용자 확정)
#   - structural_query_alignment(#17): 필드마다 점수 = min(핵심어 비율 / 0.75, 1)(비율 0.75 이상이면 그 필드는 만점).
#     축 값 = 네 필드 점수의 평균, 수준 경계 0.33 / 0.999 → 네 필드가 모두 만점일 때만 1.0(0.99면 한 필드가 비율 0.72여도 1.0이 됐다).
#     필드 수준을 0 / 0.5 / 1로 끊어 평균하면 R head의 질의 안 AUC가 0.881 → 0.813으로 떨어져(필드 안 부분 정보가 사라짐) 연속값으로 둔다.
#     연속값은 0.883(무료 8축 + PCA32, 검증 540질의; v0.8 비율 평균 0.881). 학습 쌍 수준 비율 18.3 / 76.5 / 5.3%(v0.8 27.5 / 68.8 / 3.7%).
#     이유: 비율 평균은 "how do i … my" 같은 작은 단어가 빠지면 내용어가 네 필드에 다 있어도 1.0이 안 됐다(학습 질의 400개 Top-100,
#     해당 486쌍 중 140쌍). 필드 수준 평균만 하고 경계를 0.75로 두면 "세 필드 만점 + 한 필드 절반"(0.875)이 1.0이 되어
#     가장 중요한 단어가 빠진 필드가 보강되지 않는다(82쌍). "네 필드 모두" 조건을 두면 앞의 경우 28쌍, 뒤의 경우 0쌍.
#   - jsonld(#14): 수준 1.0 = 내용 타입이 보이는 필드를 2개 이상 채웠거나, 보이는 필드를 전부 채웠다(FAQPage는 mainEntity 하나).
#     질문·답이 채워진 FAQPage만 있는 문서 1,606개가 0.5에 갇혀 있었다.
#   - meta_description(#13): 수준마다 예/아니오 질문 하나를 더하는 사다리로 바꿨다. 0 = 없거나 이 페이지 주제를 말하지 않음
#     (사이트 소개 문구는 0.5 → 0), 0.5 = 주제는 말하지만 무엇을 다루는지만 말함(안내형), 1.0 = 주제에 대한 실제 내용(수치나 주장).
#     "대상 이름"은 더 이상 구체적 사실로 치지 않는다(안내형이 1.0인지 0.5인지 애매했다).
#
# v0.8 수정 (2026-11-10, 실험 전 최종 검토: 문장을 측정 규칙·엔진 필터에 맞춤. 측정·수준 정의는 그대로)
#   - Rewriter에 마크다운을 쓰라고 명시(강조 **·*, 목록 '- '·'1. ', 표 '|', 문단은 빈 줄). 측정 규칙은 마크다운만 센다.
#     미니 비교 무작위 처방 재작성 142개 중 19개가 <b>·<strong>·<li> 같은 HTML 태그를 써서 0개로 측정됐다.
#   - 목표 수준을 넘지도 모자라지도 않게 맞추라는 공통 규칙 추가(JSON-LD 0→0.5 처방 7개 중 6개가 1.0으로 넘어감).
#   - jsonld: FAQPage는 엔진 필터에서 mainEntity 하나만 보여 "채워진 필드 2개 이상"이 될 수 없어 루브릭 예시에서 뺐다.
#     수준 0.5 문장에 "내용 타입이 아닌 타입만 있는 경우"를 명시했다.
#   - structural_query_alignment(#17): 측정은 필드 4개 각각의 비율 평균이라 1.0은 모든 필드에 핵심어가 있어야 한다.
#     Rewriter 문장을 "각 필드에"로 바꾸고, 메타 설명·JSON-LD가 없으면 더해도 된다고 적었다(0.75에 멈춘 16개 중 14개가 JSON-LD 없음).
#   - Rewriter에도 축 정의(definition)를 보여 준다. 판정 문장 단위에 소제목·목록·표 줄도 들어간다고 판정 지시에 적었다.
#   - 반환 형식 문장을 프롬프트 지시(바꾸지 않은 필드는 null)와 맞췄다. 낡은 주석 정리.
#
# v0.7 수정 (2026-11-09 사용자 확정)
#   - structural_query_alignment(#17)의 수준 경계를 0.3 / 0.9로 바꾼다(bin_edges). 수준 1.0 문장이 "모두"라서 0.75는 낮고,
#     0.75~0.9인 문서(예: 비율 0.87)가 "이미 최고"로 처방에서 빠졌다. 수준 0 문장은 "거의 없음(few or none)"으로 고친다
#     (학습 쌍 중 비율이 정확히 0인 쌍은 0%).
#   - 처방 규칙이 바뀌었다(핸드오프 §8.2, C32): 현재 수준에서 출발하고, 몇 칸 갈지는 head 예측으로 정한다.
