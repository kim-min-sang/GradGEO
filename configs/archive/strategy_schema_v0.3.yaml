# GradGEO 전략 스키마 — 초안 v0.3 (2026-10-30, 사용자 검토 전)
#
# z ∈ [0,1]^19 후보 축의 정의. 순서 = z의 인덱스.
# 19개는 "후보 풀"이다. 정제 절차(refinement)를 데이터에 적용해 최종 K ≤ 12로 줄인다.
#
# 영어 문장이 판정 LLM과 Rewriter 프롬프트에 그대로 들어가는 정본이다(코퍼스가 영어).
# 한국어는 바로 위 주석으로 단 검토용 번역이다. v0.2는 configs/archive/strategy_schema_v0.2.yaml
#
# v0.3 변경 (v0.2 대비)
#   - 공통 정의집(glossary)과 판정 순서(judge.procedure)를 추가: 핵심 주장 목록 → 잠금 확인 → 축별 근거 → 레벨.
#     근거: 판정을 작은 질문으로 쪼개면 판정 일치도가 오른다
#     (Thomas et al. SIGIR 2024; CheckEval, EMNLP 2025; TICK, 2024). 루브릭 문장을 길게 늘리는 효과는 작거나 엇갈린다
#     (Murugadoss et al. AAAI 2025; Thakur et al. 2024; Yoshida AIED 2025).
#   - 본문에 문단 구분이 없어서(표본 174개 모두 줄바꿈 0) "문단" 기준을 코드가 잘라 주는 구간 S0~S4로 바꿈.
#   - 한 레벨에 기준이 두 개 섞인 루브릭을 한 기준으로 정리. "일부·대부분"은 glossary.quantifiers를 따른다.
#   - safety를 허용(allow)·금지(forbid) 목록으로 바꾸고, 모든 축 공통 규칙(rewriter.global_safety)과 자동 날조 검사를 추가.
#   - 규칙 축(JSON-LD, 헤딩 계층)은 SAGEO가 GE에 실제로 보여 주는 부분(필터·길이 제한 적용 후)으로 계산식을 고정.
#
# 필드 설명
#   id          : 코드에서 쓰는 이름
#   name        : 한국어 이름 / name_en: 영어 이름(프롬프트용)
#   source      : 후보의 출처
#                   GEO          = GEO(KDD 2024)의 방법
#                   SAGEO-struct = SAGEO Arena의 구조 필드
#                   SAGEO-SA     = SAGEO StageAware 프롬프트의 원칙
#                   SFE          = GEO-SFE(2603.29979)의 Search-then-Synthesize 특징
#                   new          = 이번 설계에서 추가
#   dependency  : document = 문서만 보고 측정 → z_doc, 인코더가 학습·예측
#                 query    = (질의, 문서) 쌍마다 측정 → z_Q, 임베딩·규칙으로 즉석 계산(LLM 안 씀)
#   fields      : 적용·편집 위치 (structural = title/meta/headings/jsonld, body = 본문)
#   measure     : llm_judge | rule | embedding
#   levels      : 판정 단계. [0, 0.25, 0.5, 0.75, 1.0] = 5단계, [0, 0.5, 1.0] = 3단계,
#                 continuous = 규칙·임베딩 원값을 학습 데이터 분위수로 [0,1]에 고정 변환
#   editable    : Rewriter가 바꿔도 되는지 (false면 gradient mask = 0)
#   mask_if_absent : true면 원문에 재료가 없을 때 문서별로 이 축을 잠근다(수치가 없는 문서에 수치를 늘리라고 하면 지어내야 하므로)
#   absent_when : 잠금 조건. rule = 코드로 판단, judge = 판정 LLM이 2단계에서 예/아니오로 답함
#   definition  : 이 축에서 무엇을 세고 무엇을 세지 않는지
#   judge_question : 판정 3단계에서 먼저 답할 질문(개수, 또는 S1~S4 구간별 통과 여부). 레벨은 이 답으로 정한다
#   rule        : 규칙 축의 계산식
#   safety      : allow = 해도 되는 편집, forbid = 하면 안 되는 편집. rewriter.global_safety에 더해 적용
#   rubric      : 레벨별 기준 문장. 판정 LLM과 Rewriter가 같은 문장을 쓴다.
#                 Rewriter에는 바꿀 축마다 루브릭 전체를 보여 주고 현재 레벨(▶)과 목표 레벨(★)을 표시한다.
#                 목표 레벨은 gradient가 정한 z*를 반올림한 값이라 여러 칸 이동도 있다.
#   examples    : 레벨별 예시(제목·메타 설명처럼 짧은 필드만)
#   rewriter_bins : continuous 축의 Rewriter 지시용 3구간 문장
#
# 의도적으로 뺀 것
#   - Keyword Stuffing(GEO): 스팸 조작이라 white-hat 제약에 어긋난다. 질의 정합성 축으로 대체하고 반복은 safety로 막는다.
#   - 링크 밀도·내비게이션(SFE Iterative/Integrated 특징): 우리 엔진은 링크를 보지 않는다. 마크다운 확장 실험에서만.
#   - 형식 다양성(목록·표): 현재 엔진 입력이 평문이라 보이지 않는다. 마크다운 확장 실험에서만.
#   - 본문 군더더기(메뉴·광고) 비율: 표본의 8%만 해당해 문서 간 차이가 거의 없다(2026-10-30 확인).

version: 0.3-draft

judge:
  model: gpt-5-mini
  samples: 3                  # 중앙값 사용. 파일럿(500문서 × 5회)에서 3회 중앙값 ≈ 5회 중앙값이면 3으로 확정
  pilot_docs: 500
  pilot_samples: 5
  pilot_sampling:             # 파일럿 문서 뽑는 법 (2026-10-29)
    split: train              # 학습 split 질의에서만. 파일럿 5회 중앙값은 인코더 학습 레이블로 재사용
    per_dataset: equal        # 9개 데이터셋 균등(데이터셋당 질의 약 55~56개, 합 500)
    docs_per_query: 1         # 질의마다 그 질의의 문서 1개를 무작위로
    dedupe_url: true          # 이미 뽑힌 URL이면 다시 뽑기
    exclude_over_max_doc_chars: true
    check_length_distribution: true  # 뽑은 뒤 길이 분포가 코퍼스와 비슷한지 확인, 치우치면 다시 뽑기
    seed: 42
  input: full_document        # 문서 전체(제목·메타·헤딩·JSON-LD·본문). 앞부분만 자르지 않는다
  max_doc_chars: 241659       # 코퍼스 p99(고유 URL 156,015개, 전체 필드 글자 수; 2026-10-29 재수집 후 확정 코퍼스 172,632쌍에서 측정). 초과 1%는 판정 표본·타깃에서 제외하고 z는 인코더로 계산(경쟁 문서로는 코퍼스에 남김)
  one_call_per_document: true # 문서 종속 축 전부를 한 번의 호출로 JSON 반환
  second_judge: null          # 2차 판정자는 일단 쓰지 않음(사용자 결정 2026-10-28)
  freeze_prompt_before_pilot: true  # 영어 판정 프롬프트는 파일럿 직전에 고정. 같은 뜻의 프롬프트도 표현만 바꾸면
                                    # 일치도가 크게 흔들린다(Thomas et al.: 변형 42개에서 κ 0.50~0.72)
  segments:                   # 코드가 본문에서 잘라 판정 프롬프트에 문서와 함께 넣는 구간(본문에 문단 구분이 없어서)
    S0: {start: 0.0, words: 100}            # 본문 첫 100단어
    S1_S4:                    # 본문 단어 위치 20·40·60·80%에서 시작하는 200단어 구간 4개(256토큰 조각과 비슷한 길이)
      starts: [0.2, 0.4, 0.6, 0.8]
      words: 200
      align_to_sentence_start: true         # 가장 가까운 문장 시작에 맞춘다
                              # 본문이 짧아 구간이 겹쳐도 그대로 쓴다. 본문이 200단어 미만이면 네 구간 모두 본문 전체
  procedure:                  # 판정 순서. 한 번의 호출 안에서 이 순서대로 답하게 한다
    # 1단계: 문서 전체를 읽고 핵심 주장을 최대 5개 적는다(glossary.key_claims 정의대로)
    - "Step 1. Read the whole document. List its key claims (at most 5), as defined in the glossary."
    # 2단계: 잠금 질문(absent_when: judge)에 예/아니오로 답한다
    - "Step 2. Answer each availability question with yes or no."
    # 3단계: 축마다 judge_question에 한 줄로 답한다(개수, 또는 S1~S4 각각 통과/실패)
    - "Step 3. For each axis, answer its judge question in one short line (a count, or pass/fail for each segment)."
    # 4단계: 3단계 답에 맞는 레벨을 고른다. 두 레벨 사이에서 애매하면 낮은 쪽을 고른다
    - "Step 4. Choose the level whose description matches your Step 3 answer. If torn between two levels, choose the lower one."
  output: json                # {key_claims: [...], availability: {axis_id: yes/no}, axes: {axis_id: {evidence: "...", level: 0.5}}}

glossary:                     # 공통 정의. 판정 프롬프트와 Rewriter 프롬프트 맨 앞에 들어간다
  # 핵심 주장: 문서가 전하려는 주요 사실이나 결론. 독자가 요약할 때 꼽을 것. 최대 5개, 한 문장씩, 중요한 순서로.
  # 내비게이션·광고·상투 문구는 무시한다
  key_claims: "The main facts or conclusions the document is trying to convey, as a reader would list them when summarizing it. At most 5, one sentence each, most important first. Ignore navigation, ads, and boilerplate."
  quantifiers:
    # 일부: 하나 이상이지만 절반 미만
    some: "at least one, but fewer than half"
    # 대부분: 절반 이상이지만 전부는 아님
    most: "at least half, but not all"
    # 모든: 예외 없이 전부
    all: "every one, with no exceptions"
  # 구간: S0는 본문 첫 100단어, S1~S4는 본문 여러 곳에서 뽑은 200단어 구간. 구간은 그 안의 글만 보고 판단한다.
  # (Rewriter용) 구간은 본문 전체에 퍼져 있으므로, 구간 기준 축을 올리려면 본문 전체에 걸쳐 고친다
  segments: "S0 is the first 100 words of the body. S1-S4 are 200-word excerpts from different parts of the body. Judge a segment using only the text inside it. When rewriting, segments are spread across the body, so apply segment-based changes throughout the body."

normalization:
  continuous_fit_on: train    # 분위수 변환은 학습 split 데이터로만 적합하고 고정

refinement:                   # 정제 절차: 후보 19개 → 최종 K ≤ max_axes
                              # ①~④는 통과/탈락 결과를 보지 않는다. ⑤만 head 성능을 보며 학습·검증 split만 쓴다
                              # ① 보임·편집 가능: 스키마 작성 때 적용(엔진 입력에 보이고, 지어내지 않고 고칠 수 있는 특징만)
  test_retest:                # ② 측정 신뢰도. llm_judge 축에만 적용(rule·embedding 축은 항상 같은 값이라 제외)
    rho_min_median3: 0.8      # 3회 중앙값 레이블 기준 순위 상관(Spearman)
    rho_min_single: 0.6       # 같은 기준을 1회 판정끼리로 환산한 값(Spearman–Brown, k=3이면 0.6 → 약 0.82)
    collapse_to_3:            # ②-b 5단계 축이 위 기준에 못 미치면 이미 받은 판정을 3단계로 묶어 다시 계산(재판정 없음)
      map: {0.0: 0.0, 0.25: 0.0, 0.5: 0.5, 0.75: 1.0, 1.0: 1.0}
                              # 5단계로 통과 → 5단계 유지 / 5단계 실패·3단계 통과 → 그 축만 3단계로 전환(루브릭도 합침)
                              # 둘 다 실패 → 제거. 3단계로 바뀐 축은 조작 시험과 ③을 3단계 기준으로 다시 확인
  perturbation:               # ② 타당도: 문서를 의도적으로 조작한 뒤 다시 판정
    hit_min: 0.8              # 점수가 예상 방향으로 움직인 비율. 점수가 그대로면 실패로 센다
    strong_edit: true         # 단계가 확실히 바뀌도록 크게 조작한다(예: 수치 전부 삭제)
  max_single_level_frac: 0.9  # ③ 한 레벨에 몰린 문서 비율 상한. 이산 축에만 적용(연속 축은 분위수 변환이라 제외).
                              #   파일럿에서 먼저 보고, 본 판정 후 다시 확인
  merge:                      # ④ 중복
    abs_r: 0.7                # 축 간 |Spearman| 이상이면 병합
    keep: higher_reliability  # ②의 신뢰도가 더 높은 축을 남긴다
  importance:                 # ⑤ 쓸모: permutation importance(검증 split)
    shuffles: 10              # 10번 섞은 평균 하락으로 판단
    min_drop_auc: 0.01        # R·K head: 검증 AUC 절대 하락
    min_drop_spearman: 0.01   # G head: 인용률과의 순위 상관 절대 하락(레이블이 연속값이라 AUC 대신)
    remove_if: all_heads_below  # 세 head 모두에서 기준 미만일 때만 제거
  max_axes: 12                # ①~⑤ 뒤에도 넘으면 ⑤ 중요도 낮은 순으로 자른다(목표 10개 안팎)

rewriter:
  model: gpt-5-mini           # SAGEO optimizer와 같은 모델, 문서 전체 재작성
  # 지시 형식: 바꿀 축마다 루브릭 전체를 보여 주고, 현재 레벨에 ▶, 목표 레벨에 ★를 표시하고, 그 축의 허용·금지 목록을 붙인다
  instruction_format: "For each axis to change, show its full rubric, mark the current level with ▶ and the target level with ★, and list its allow and forbid rules."
  global_safety:              # 모든 축에 공통으로 적용하는 규칙
    # 원문에 없는 사실, 숫자, 이름, 날짜, 인용, 출처, 사례, URL을 더하지 않는다
    - "Do not add any fact, number, name, date, quote, source, example, or URL that is not in the original document."
    # 핵심 주장과 그 뒷받침 내용을 지우지 않는다. 크롤링 잔재(메뉴 문구, 깨진 조각, 반복되는 상투 문구)는 지워도 된다
    - "Do not delete key claims or their supporting details. You may remove crawl artifacts (navigation text, broken fragments, repeated boilerplate)."
    # 모든 진술을 원문과 일치시킨다: 의미, 값, 근거의 확실성 정도를 바꾸지 않는다
    - "Keep every statement consistent with the original: do not change meanings, values, or how certain the evidence is."
    # 지시된 축이 요구하는 것만 바꾸고, 나머지는 원문에 최대한 가깝게 둔다
    - "Change only what the listed axes require; keep everything else as close to the original as possible."
    # 단어나 구절을 부자연스럽게 반복하지 않는다(키워드 스터핑 금지)
    - "Do not repeat words or phrases unnaturally (no keyword stuffing)."
    # 원문의 언어를 유지한다
    - "Keep the original language."
    # 모든 필드(제목, 메타 설명, 헤딩, JSON-LD, 본문)를 입력과 같은 형식으로 돌려준다
    - "Return every field (title, meta description, headings, JSON-LD, body) in the same format as the input."
  fabrication_check:          # 자동 날조 검사: 재작성본에 새로 생긴 재료를 원문과 규칙으로 대조한다
    numbers: "numeric tokens in the rewrite (commas removed) that do not appear in the original"        # 원문에 없는 숫자
    quotes: "quoted spans of 4+ words in the rewrite that do not appear verbatim in the original"       # 원문에 그대로 없는 4단어 이상 따옴표 구절
    entities: "PERSON, ORG, WORK_OF_ART, LAW entities (spaCy NER) in the rewrite whose text does not appear in the original"  # 원문에 없는 인명·기관명·문헌명·법령명
    report: "flag rate overall and per instructed axis"   # 전체와 지시한 축별로 걸린 비율을 보고(white-hat 주장의 근거)
    analysis: "main results include all rewrites; a sensitivity analysis excludes flagged rewrites"   # 제안: 본 결과는 전부 포함, 걸린 재작성본을 뺀 민감도 분석 추가

strategies:

  # ── 내용 · 문서 종속 ──────────────────────────────────────────────

  - id: statistics
    name: 수치 근거
    name_en: Statistics
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: true
    # 잠금: 본문에 연도·날짜·목록 번호를 뺀 숫자가 하나도 없을 때
    absent_when: {type: rule, check: "the body has no numeric token other than years, dates, and list or section numbers"}
    # 쓸모 있는 수치: 무엇을 쟀는지와 단위가 같은 문장이나 바로 옆 문장에서 드러나는 숫자(예: '성인 2,300명', '혈압 12% 감소', '연 1,200달러').
    # 연도, 날짜, 목록·절 번호, 버전 번호, 전화번호, 주소, 모델 번호는 세지 않는다
    definition: "A usable number is a number whose measured object and unit are clear from the same or an adjacent sentence (e.g., '2,300 adults', '12% lower blood pressure', '$1,200 per year'). Do not count years, dates, list or section numbers, version numbers, phone numbers, addresses, or model numbers."
    # 핵심 주장 중 몇 개에 쓸모 있는 수치가 같은 문장이나 바로 옆 문장에 있나? 본문 다른 곳에도 쓸모 있는 수치가 있나?
    judge_question: "How many key claims have at least one usable number in the same or an adjacent sentence? Are there usable numbers elsewhere in the body?"
    safety:
      allow:
        # 원문 수치를 그 수치가 뒷받침하는 주장 옆으로 옮긴다
        - "Move a number from the original next to the claim it supports."
        # 원문 다른 곳에 적힌 단위·대상·시점을 숫자에 붙인다
        - "Attach a unit, measured object, or time that the original states elsewhere."
        # '많은', '약 3분의 1' 같은 막연한 표현을 원문에 적힌 정확한 값으로 바꾼다
        - "Replace vague wording ('many', 'about a third') with the exact value stated in the original."
      forbid:
        # 원문에 없는 숫자
        - "Any number that is not in the original."
        # 원문 숫자로 계산한 새 숫자(합계, 비율, 증감률)
        - "New numbers computed from the original's numbers (sums, ratios, percent changes)."
        # 반올림이나 단위 환산으로 값을 바꾸기
        - "Changing a value by rounding or unit conversion."
        # 원문에 없는 시점·표본·출처를 숫자에 붙이기
        - "Attaching a time, sample, or source that the original does not state."
    rubric:
      # 쓸모 있는 수치가 없다(숫자가 없거나, 단위·대상을 알 수 없는 숫자만 있다)
      0.0:  "No usable numbers (no numbers at all, or only numbers whose unit or object is unclear)."
      # 쓸모 있는 수치가 있지만 핵심 주장에는 하나도 붙어 있지 않다
      0.25: "Usable numbers exist, but none is attached to a key claim."
      # 일부 핵심 주장(절반 미만)에 쓸모 있는 수치가 있다
      0.5:  "Some key claims (fewer than half) have a usable number."
      # 대부분의 핵심 주장(절반 이상, 전부는 아님)에 쓸모 있는 수치가 있다
      0.75: "Most key claims (at least half, but not all) have a usable number."
      # 모든 핵심 주장에 쓸모 있는 수치가 있다
      1.0:  "Every key claim has a usable number."

  - id: quotation
    name: 인용구
    name_en: Quotations
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.5, 1.0]
    editable: true
    mask_if_absent: true
    # 잠금: 원문에 누군가의 말을 옮긴 따옴표 문장이 하나도 없을 때
    absent_when: {type: judge, question: "Does the original contain any text in quotation marks that reproduces someone's words?"}
    # 직접 인용: 누군가의 말을 그대로 옮긴 따옴표(또는 블록 인용) 안의 문장으로, 발언자가 이름이나 직함으로 밝혀진 것.
    # 따옴표로 감싼 제목·용어·한 단어, 비꼬는 따옴표, 작성자 이름 없는 후기는 세지 않는다
    definition: "An attributed direct quote is text in quotation marks (or a block quote) that reproduces someone's words, with the speaker identified by name or role (e.g., 'Dr. Jane Smith, a cardiologist at Mayo Clinic'). Do not count quoted titles, quoted terms or single words, scare quotes, or reviews without a named reviewer."
    # 발언자가 밝혀진 직접 인용은 몇 개이고, 그중 핵심 주장을 직접 뒷받침하는 것이 있나?
    judge_question: "How many attributed direct quotes are there, and does any of them directly support a key claim?"
    safety:
      allow:
        # 원문의 직접 인용을 그것이 뒷받침하는 주장 옆으로 옮긴다
        - "Move a direct quote from the original next to the claim it supports."
        # 원문 다른 곳에 밝혀진 발언자 이름·직함을 인용에 붙인다
        - "Attribute a quote to a speaker that the original identifies elsewhere."
      forbid:
        # 원문에 없는 인용, 인물, 발언
        - "Any quote, speaker, or statement that is not in the original."
        # 간접 화법('~라고 말했다')을 직접 인용으로 바꾸기(정확한 표현을 지어내게 되므로)
        - "Turning indirect speech into a direct quote (this invents exact wording)."
        # 인용문 안의 단어를 바꾸기
        - "Changing the words inside a quote."
    rubric:
      # 발언자가 밝혀진 직접 인용이 없다
      0.0: "No attributed direct quote."
      # 발언자가 밝혀진 직접 인용이 있지만, 어느 것도 핵심 주장을 직접 뒷받침하지 않는다
      0.5: "Attributed direct quotes exist, but none directly supports a key claim."
      # 핵심 주장을 직접 뒷받침하는, 발언자가 밝혀진 직접 인용이 하나 이상 있다
      1.0: "At least one attributed direct quote directly supports a key claim."

  - id: cite_sources
    name: 출처
    name_en: Cited sources
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: true
    # 잠금: 원문 어디에도(참고 문헌 포함) 구체적인 출처 이름이 없을 때
    absent_when: {type: judge, question: "Does the original name any specific source anywhere (an organization, author, publication, dataset, or official document), including in a references section?"}
    # 이름 있는 출처: 본문에서 어떤 주장의 출처로 이름이 나온 기관·저자·문헌·데이터·공식 문서(예: '2021년 CDC 보고서에 따르면', 'Smith et al. (2020)').
    # 링크는 엔진에 보이지 않으므로 본문에 이름이 없으면 세지 않는다. '연구에 따르면', '전문가들은' 같은 막연한 표현과 사이트 자신('우리 팀')은 세지 않는다
    definition: "A named source is an organization, author, publication, dataset, or official document named in the text as the origin of a claim (e.g., 'according to a 2021 CDC report', 'Smith et al. (2020) found'). Hyperlinks are invisible to the engine, so a source counts only if it is named in the text. Vague attributions ('studies show', 'experts say') and the publishing site itself ('our team') are not named sources."
    # 핵심 주장 중 몇 개가 이름 있는 출처에 연결되어 있나? 그 밖의 출처 표기(막연한 표현, 부수 내용의 출처)가 있나?
    judge_question: "How many key claims are attributed to a named source? Does the document contain any other attribution (vague, or named sources for minor points)?"
    safety:
      allow:
        # 원문 다른 곳(참고 문헌, 링크 문구 등)에 이름이 나오고 원문이 그 주장과 연결한 출처를, 그 주장 옆에 밝힌다
        - "Name, next to a claim, a source that the original names elsewhere (e.g., in a reference list or link text) and connects to that claim."
        # '연구에 따르면'을, 원문이 그 연구를 특정한 경우에만 그 연구 이름으로 바꾼다
        - "Replace 'studies show' with the specific study only if the original identifies it."
      forbid:
        # 출처·저자·연도·문헌을 지어내기
        - "Inventing sources, authors, years, or publications."
        # 원문이 연결하지 않은 출처에 주장을 갖다 붙이기
        - "Attributing a claim to a source that the original does not connect to it."
        # URL 추가
        - "Adding URLs."
    rubric:
      # 어떤 형태의 출처 표기도 없다
      0.0:  "No attribution of any kind."
      # 핵심 주장에는 이름 있는 출처가 없다(막연한 표현이나 부수적인 내용의 출처만 있다)
      0.25: "No key claim has a named source; there are only vague attributions or sources for minor points."
      # 일부 핵심 주장(절반 미만)에 이름 있는 출처가 있다
      0.5:  "Some key claims (fewer than half) are attributed to a named source."
      # 대부분의 핵심 주장(절반 이상, 전부는 아님)에 이름 있는 출처가 있다
      0.75: "Most key claims (at least half, but not all) are attributed to a named source."
      # 모든 핵심 주장에 이름 있는 출처가 있다
      1.0:  "Every key claim is attributed to a named source."
    # 비고: v0.2의 "참고 문헌이 정리되어 있다" 조건은 다른 기준이 섞여서 뺐다

  - id: fluency
    name: 유창성
    name_en: Fluency
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 문제 문장: 문법 오류가 있거나, 끊기거나 다른 문장과 붙어 버렸거나, 단어가 빠졌거나,
    # 크롤링 잔재(예: 'Early Life[]', 메뉴 단어, 'ExplainedWhich'처럼 붙은 단어)가 있거나, 읽기 어색한 문장
    definition: "A problem sentence has a grammatical error, is broken or run together with another sentence, is missing words, contains crawl artifacts (e.g., 'Early Life[]', stray menu words, words glued together like 'ExplainedWhich'), or is awkward to read."
    # S1~S4의 문장 중 문제 문장은 대략 몇 분의 몇인가?
    judge_question: "In S1-S4, roughly what share of sentences are problem sentences?"
    safety:
      allow:
        # 문법을 고치고, 문장을 합치거나 나누고, 크롤링 잔재를 지운다
        - "Fix grammar, join or split sentences, and remove crawl artifacts."
        # 문장 사이의 연결어를 넣거나 바꾼다
        - "Add or change connecting words between sentences."
      forbid:
        # 주장, 값, 이름을 바꾸기
        - "Changing any claim, value, or name."
        # 크롤링 잔재 말고 다른 내용을 지우기
        - "Removing content other than crawl artifacts."
    rubric:
      # 문장의 절반 이상이 문제 문장이다
      0.0:  "At least half of the sentences are problem sentences."
      # 4분의 1 이상(절반 미만)이 문제 문장이다
      0.25: "At least a quarter (but fewer than half) are problem sentences."
      # 10분의 1 이상(4분의 1 미만)이 문제 문장이다
      0.5:  "At least one in ten (but fewer than a quarter) are problem sentences."
      # 문제 문장이 있지만 10분의 1 미만이다
      0.75: "Some problem sentences, but fewer than one in ten."
      # 문제 문장이 없다
      1.0:  "No problem sentences."
    # 비고: easy_language와 |r| ≥ 0.7이면 정제 ④에서 "가독성"으로 병합

  - id: easy_language
    name: 쉬운 표현
    name_en: Easy language
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 어려운 문장: 그 분야 배경지식이 없는 일반 성인이 다시 읽어야 하는 문장.
    # 길고 여러 절이 얽혀 있거나(대략 30단어 이상), 전문 용어를 풀이 없이 쓴 경우
    definition: "A hard sentence is one that a general adult reader without background in the field would need to reread: it is long with several nested clauses (roughly 30 or more words), or it uses a technical term without explaining it."
    # S1~S4의 문장 중 어려운 문장은 대략 몇 분의 몇인가?
    judge_question: "In S1-S4, roughly what share of sentences are hard sentences?"
    safety:
      allow:
        # 긴 문장을 나눈다
        - "Split long sentences."
        # 새 주장을 더하지 않는 짧은 풀이를 전문 용어에 붙인다(예: 'hypertension (high blood pressure)')
        - "Add a short plain-language gloss for a technical term (e.g., 'hypertension (high blood pressure)') without adding new claims."
        # 드문 단어를 같은 뜻의 흔한 단어로 바꾼다
        - "Replace a rare word with a common word of the same meaning."
      forbid:
        # 쉽게 만들려고 핵심 주장, 숫자, 조건을 빼기
        - "Dropping key claims, numbers, or conditions to make the text simpler."
        # 정확한 용어를 뜻이 달라지는 일상어로 바꾸기
        - "Replacing a precise term with an everyday word that changes the meaning."
    rubric:
      # 문장의 절반 이상이 어려운 문장이다
      0.0:  "At least half of the sentences are hard sentences."
      # 4분의 1 이상(절반 미만)이 어려운 문장이다
      0.25: "At least a quarter (but fewer than half) are hard sentences."
      # 10분의 1 이상(4분의 1 미만)이 어려운 문장이다
      0.5:  "At least one in ten (but fewer than a quarter) are hard sentences."
      # 어려운 문장이 있지만 10분의 1 미만이다
      0.75: "Some hard sentences, but fewer than one in ten."
      # 어려운 문장이 없다
      1.0:  "No hard sentences."

  - id: authoritative_tone
    name: 권위 어조
    name_en: Authoritative tone
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 어조만 본다. 단정하지 않은 주장: 얼버무림(may, might, perhaps, it seems, could possibly)이나
    # 1인칭 의견 표지(I think, in my opinion, we feel)로 말한 주장.
    # 근거·출처는 여기서 보지 않는다(statistics·cite_sources가 본다). 실제 불확실성을 나타내는 얼버무림도 그대로 센다
    definition: "Tone only. A non-assertive claim is stated with hedges ('may', 'might', 'perhaps', 'it seems', 'could possibly') or first-person opinion markers ('I think', 'in my opinion', 'we feel'). Do not judge evidence or sources here; other axes cover them. Count hedges even when they reflect real uncertainty."
    # S1~S4의 주장 중 단정하지 않은 주장은 대략 몇 분의 몇인가?
    judge_question: "In S1-S4, roughly what share of claims are non-assertive?"
    safety:
      allow:
        # 원문이 확립된 것으로 제시한 주장에서 군더더기 얼버무림과 1인칭 의견 표지를 뺀다
        - "Remove filler hedges and first-person opinion markers from claims that the original presents as established."
        # 직접적인 평서문으로 쓴다
        - "Use direct, declarative sentences."
      forbid:
        # 원문이 근거가 제한적·예비적·논쟁 중이라고 한 내용을 확정된 것처럼 쓰기
        - "Making a finding sound certain when the original says the evidence is limited, preliminary, or disputed."
        # 원문에 없는 최상급 표현이나 전문성·자격 주장('최고 전문가들이')
        - "Adding superlatives or claims of expertise or credentials that are not in the original."
    rubric:
      # 주장의 절반 이상이 단정하지 않은 주장이다
      0.0:  "At least half of the claims are non-assertive."
      # 4분의 1 이상(절반 미만)이 단정하지 않은 주장이다
      0.25: "At least a quarter (but fewer than half) are non-assertive."
      # 10분의 1 이상(4분의 1 미만)이 단정하지 않은 주장이다
      0.5:  "At least one in ten (but fewer than a quarter) are non-assertive."
      # 단정하지 않은 주장이 있지만 10분의 1 미만이다
      0.75: "Some non-assertive claims, but fewer than one in ten."
      # 모든 주장을 직접 단정한다
      1.0:  "All claims are stated directly."
    # 비고: 반복 일관성·조작 검사에서 탈락할 가능성이 높은 축. v0.2의 "근거를 바탕으로"는 출처·수치 축과 겹쳐서 뺐다

  - id: technical_terms
    name: 전문 용어
    name_en: Technical terms
    source: GEO
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 분야 용어: 그 분야 전문가가 쓰는 정확한 단어나 구(예: 'myocardial infarction', 'amortization', 'API rate limit').
    # 브랜드명과 일반 단어는 세지 않는다. 잘못 쓴 용어도 세지 않는다
    definition: "A domain term is a precise word or phrase that specialists in the document's field use (e.g., 'myocardial infarction', 'amortization', 'API rate limit'). Brand names and general words do not count. Misused terms do not count."
    # S1~S4 각각: 올바르게 쓴 분야 용어가 하나 이상 있나? 통과한 구간 수를 센다
    judge_question: "For each of S1-S4: does the segment contain at least one correctly used domain term? Count the segments that pass."
    safety:
      allow:
        # 원문이 이미 설명하는 개념을 가리키는 막연한 일상어를 그 개념의 정확한 분야 용어로 바꾼다
        - "Replace vague everyday wording with the precise domain term for a concept the original already describes."
      forbid:
        # 원문에 없는 개념을 들여오기
        - "Introducing concepts that are not in the original."
        # 용어를 틀리게 쓰거나 다른 분야의 용어를 쓰기
        - "Using a term incorrectly or outside its field."
    rubric:
      # 올바르게 쓴 분야 용어가 있는 구간이 없다
      0.0:  "No segment contains a correctly used domain term."
      # 4개 구간 중 1개에 있다
      0.25: "1 of the 4 segments contains a correctly used domain term."
      # 4개 구간 중 2개에 있다
      0.5:  "2 of the 4 segments contain a correctly used domain term."
      # 4개 구간 중 3개에 있다
      0.75: "3 of the 4 segments contain a correctly used domain term."
      # 4개 구간 모두에 있다
      1.0:  "All 4 segments contain a correctly used domain term."
    # 비고: easy_language와 반대 방향일 수 있음 → 최적화 시 상충 진단 대상. v0.2의 정확성 기준은 safety로 옮겼다

  - id: unique_words
    name: 어휘 다양성
    name_en: Vocabulary variety
    source: GEO
    dependency: document
    fields: [body]
    measure: rule             # MTLD(길이에 덜 민감한 어휘 다양성 지표)
    levels: continuous
    editable: true
    mask_if_absent: false
    safety:
      allow:
        # 반복되는 일상어를 정확한 동의어로 바꾼다
        - "Vary repeated everyday words with accurate synonyms."
      forbid:
        # 뜻이 달라지는 동의어
        - "Synonyms that change the meaning."
        # 주제 이름이나 분야 용어를 느슨한 말로 바꾸기
        - "Replacing the topic name or domain terms with looser words."
    rewriter_bins:
      # 같은 단어와 표현이 반복된다
      0.0: "The same words and phrases are repeated."
      # 어휘 다양성이 보통이다
      0.5: "Vocabulary variety is average."
      # 같은 대상을 정확하면서도 다양한 표현으로 서술한다
      1.0: "The same things are described with accurate and varied wording."
    # 비고: topic_term_consistency(주제 이름 반복)와 반대 방향일 수 있음 → 최적화 시 상충 진단 대상

  - id: concrete_claims
    name: 구체적 주장
    name_en: Concrete claims
    source: SAGEO-SA
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 구체적인 핵심 주장: 특정 대상(사람, 기관, 제품, 장소, 질환 등)이나 특정 사례를 밝히거나,
    # 언제·어디서·누구에게·어떤 조건에서 성립하는지 밝힌 것. 숫자만 있는 것은 세지 않는다(statistics가 본다)
    definition: "A key claim is concrete if it names a specific entity (person, organization, product, place, condition, etc.) or a specific case, or states when, where, for whom, or under what conditions it holds. A number alone does not make a claim concrete (the statistics axis covers numbers)."
    # 핵심 주장 중 몇 개가 구체적인가? 본문 다른 곳에 구체적인 내용이 있나?
    judge_question: "How many key claims are concrete? Are there concrete details elsewhere in the body?"
    safety:
      allow:
        # 원문 다른 곳에 나온 특정 대상·사례·조건으로 핵심 주장을 다시 쓴다
        - "Restate a key claim with a specific entity, case, or condition that the original gives elsewhere."
      forbid:
        # 사례, 경우, 이름, 조건을 지어내기
        - "Inventing examples, cases, names, or conditions."
    rubric:
      # 구체적인 내용이 어디에도 없고 일반론뿐이다
      0.0:  "No concrete details anywhere; the text consists of general statements only."
      # 구체적인 내용은 있지만 구체적인 핵심 주장은 없다
      0.25: "Concrete details exist, but no key claim is concrete."
      # 일부 핵심 주장(절반 미만)이 구체적이다
      0.5:  "Some key claims (fewer than half) are concrete."
      # 대부분의 핵심 주장(절반 이상, 전부는 아님)이 구체적이다
      0.75: "Most key claims (at least half, but not all) are concrete."
      # 모든 핵심 주장이 구체적이다
      1.0:  "Every key claim is concrete."

  - id: topic_term_consistency
    name: 주제어 일관성
    name_en: Topic name consistency
    source: SAGEO-SA          # keyword reinforcement
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 주제 이름: 문서가 다루는 중심 대상의 이름(예: 'vitamin D deficiency', 'Darlene Conner')이나 그 표준 동의어·약어
    definition: "The topic name is the name of the document's main subject (e.g., 'vitamin D deficiency', 'Darlene Conner') or its standard synonym or abbreviation."
    # S1~S4 각각: 대명사나 'it/this'만이 아니라 주제 이름을 직접 쓰고 있나? 통과한 구간 수를 센다
    judge_question: "For each of S1-S4: does the segment state the topic name explicitly (not only through pronouns or 'it'/'this')? Count the segments that pass."
    safety:
      allow:
        # 모호한 대명사나 막연한 지칭을 주제 이름으로 바꾼다
        - "Replace an ambiguous pronoun or vague reference with the topic name."
      forbid:
        # 이미 뜻이 분명한 문장에 주제 이름을 끼워 넣기
        - "Inserting the topic name into sentences that are already clear."
        # 한 문장에 주제 이름을 두 번 이상 쓰기
        - "Using the topic name more than once in a sentence."
    rubric:
      # 주제 이름을 직접 쓴 구간이 없다
      0.0:  "No segment states the topic name explicitly."
      # 4개 구간 중 1개가 주제 이름을 직접 쓴다
      0.25: "1 of the 4 segments states the topic name explicitly."
      # 4개 구간 중 2개
      0.5:  "2 of the 4 segments state the topic name explicitly."
      # 4개 구간 중 3개
      0.75: "3 of the 4 segments state the topic name explicitly."
      # 4개 구간 모두
      1.0:  "All 4 segments state the topic name explicitly."
    # 비고: chunk_independence와 겹칠 수 있음 → 정제 ④에서 확인

  # ── 내용 · 질의 종속 [Q] ─────────────────────────────────────────

  - id: body_query_alignment
    name: 본문 질의 정합성 [Q]
    name_en: Body-query alignment
    source: new
    dependency: query
    fields: [body]
    measure: embedding+rule   # 분위수 변환 후 평균: (a) 질의 핵심어(불용어 제외)의 본문 등장 비율
                              #                       (b) 질의와 본문 passage 임베딩 코사인의 최댓값
    levels: continuous
    editable: true
    mask_if_absent: false
    safety:
      allow:
        # 본문이 이미 다루는 내용에 질의의 표현을 쓴다
        - "Use the query's wording for content the body already covers."
        # 본문에서 질의에 답하는 부분을 더 분명하게 만든다
        - "Make the parts of the body that address the query more explicit."
      forbid:
        # 질의에 답하려고 원문에 없는 내용을 더하기
        - "Adding content to answer the query that the original does not contain."
        # 질의 단어를 부자연스럽게 반복하기
        - "Repeating query words unnaturally."
    rewriter_bins:
      # 본문이 질의의 핵심을 거의 다루지 않는다
      0.0: "The body barely addresses the core of the query."
      # 본문이 질의의 핵심을 일부 다룬다
      0.5: "The body partly addresses the core of the query."
      # 본문이 질의의 핵심을 직접 다루고 질의의 표현을 자연스럽게 쓴다
      1.0: "The body directly addresses the core of the query and naturally uses its wording."

  - id: answer_front_loading
    name: 앞부분 답변성 [Q]
    name_en: Answer front-loading
    source: SAGEO-SA          # 핵심 주장 전진 배치
    dependency: query
    fields: [body]
    measure: embedding        # sim(질의, 본문 첫 256토큰) / max_p sim(질의, passage p), [0,1]로 자름
    levels: continuous
    editable: true
    mask_if_absent: false
    safety:
      allow:
        # 질의에 답하는 부분을 앞쪽으로 옮긴다
        - "Move the passage that answers the query toward the start."
        # 본문 내용만으로 만든 1~2문장 답을 맨 앞에 넣는다
        - "Add a 1-2 sentence answer at the start, built only from the body."
      forbid:
        # 내용을 지우기
        - "Deleting content."
        # 본문이 뒷받침하지 않는 답을 앞에 쓰기
        - "An opening answer that the body does not support."
    rewriter_bins:
      # 질의에 대한 답이 문서 뒷부분에만 있다
      0.0: "The answer to the query appears only late in the document."
      # 질의에 대한 답이 문서 중간쯤에 나온다
      0.5: "The answer to the query appears around the middle of the document."
      # 본문 첫 100단어 안에서 질의에 바로 답한다
      1.0: "The first 100 words of the body answer the query directly."

  # ── 구조 · 문서 종속 ─────────────────────────────────────────────

  - id: title_informativeness
    name: 제목 정보성
    name_en: Title informativeness
    source: SAGEO-struct
    dependency: document
    fields: [structural]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # <title> 필드만 본다. 끝에 붙은 사이트 이름('| Healthline')은 무시한다
    definition: "Judge the title field only. Ignore a trailing site name (e.g., '| Healthline')."
    # 제목이 이 페이지의 구체적인 대상을 밝히나? 그 대상에 대해 무엇을 다루는지(측면, 범위, 개수)도 밝히나?
    judge_question: "Does the title name the page's specific subject? Does it also say what the page offers about it (aspect, scope, or count)?"
    safety:
      allow:
        # 본문이 다루는 대상과 측면만으로 제목을 다시 쓴다
        - "Rewrite the title using only the subject and aspects that the body covers."
        # 사이트 이름이 있으면 유지한다
        - "Keep the site name if present."
      forbid:
        # 본문에 없는 내용을 약속하기(예: 본문에 없는 개수의 팁)
        - "Promising content the body does not have (e.g., a number of tips the body does not list)."
        # 낚시성 표현
        - "Clickbait wording."
    rubric:
      # 제목이 없거나 사이트 이름뿐이다
      0.0:  "Missing, or only the site name."
      # 주제를 밝히지 않는 일반적인 제목이다
      0.25: "Generic; does not name the topic."
      # 넓은 주제는 밝히지만 이 페이지의 구체적인 대상은 밝히지 않는다
      0.5:  "Names the broad topic but not the page's specific subject."
      # 구체적인 대상은 밝히지만, 그것에 대해 무엇을 다루는지는 없다
      0.75: "Names the specific subject, but not what the page offers about it."
      # 구체적인 대상과, 그것에 대해 다루는 측면·범위·개수를 간결하게 밝힌다
      1.0:  "Names the specific subject and what the page offers about it (aspect, scope, or count), concisely."
    examples:                 # 비타민 D 결핍 증상 페이지의 예
      0.0:  "Home | Healthline"
      0.25: "Health Article"
      0.5:  "Vitamins and Your Health"
      0.75: "Vitamin D Deficiency"
      1.0:  "Vitamin D Deficiency: 9 Symptoms, Causes, and Treatments"

  - id: meta_description
    name: 메타 설명
    name_en: Meta description
    source: SAGEO-struct
    dependency: document
    fields: [structural]
    measure: llm_judge
    levels: [0, 0.5, 1.0]
    editable: true
    mask_if_absent: false
    # 메타 설명 필드만 본다
    definition: "Judge the meta description field only."
    # 메타 설명이 있나? 이 페이지의 구체적인 대상과 핵심 주장 하나 이상을 본문과 일치하게 밝히나?
    judge_question: "Is there a meta description? Does it state this page's specific subject and at least one key claim, consistent with the body?"
    safety:
      allow:
        # 본문의 대상과 핵심 주장으로 1~2문장(약 160자 이하)을 쓴다
        - "Write 1-2 sentences (about 160 characters or fewer) using the subject and key claims from the body."
      forbid:
        # 본문에 없는 주장
        - "Claims that are not in the body."
        # 키워드 나열
        - "Keyword lists."
    rubric:
      # 메타 설명이 없거나 비어 있다
      0.0: "Missing or empty."
      # 있지만 이 페이지를 요약하지 않는다(사이트 전체 소개 문구, 일반적인 문장, 핵심 주장이 없는 첫 문장 복사)
      0.5: "Present, but does not summarize this page: a site-wide slogan, generic text, or a copied opening sentence with no key claim."
      # 이 페이지의 구체적인 대상과 핵심 주장 하나 이상을 본문과 일치하게 밝힌다
      1.0: "States this page's specific subject and at least one key claim, consistent with the body."
    examples:                 # 비타민 D 결핍 증상 페이지의 예
      0.0: ""
      0.5: "Your trusted source for health news and advice since 1999."
      1.0: "Vitamin D deficiency can cause fatigue, bone pain, and muscle weakness. Learn the most common symptoms and how it is treated."
    # 비고: v0.2에서 0.0이던 "내용과 무관한 메타 설명"은 0.5로 옮겼다(0.0 = 없음만, 규칙으로도 확인 가능)

  - id: jsonld
    name: 구조화 데이터 (JSON-LD)
    name_en: Structured data (JSON-LD)
    source: SAGEO-struct
    dependency: document
    fields: [structural]
    measure: rule
    levels: [0, 0.5, 1.0]
    editable: true
    mask_if_absent: false
    rule:
      # SAGEO가 GE에 보여 주는 형태로 판단한다: filter_jsonld_for_generator(타입별 허용 필드만 남김) 적용, @graph는 펼친다
      visible_view: "SAGEO filter_jsonld_for_generator (type-wise field whitelist), with @graph flattened"
      # 내용 타입: 페이지 내용 자체를 설명하는 타입. 나머지(Organization, WebSite, WebPage, Person, LocalBusiness, BreadcrumbList 등)는 기본 타입
      content_types: [Article, NewsArticle, BlogPosting, ScholarlyArticle, MedicalWebPage, DiscussionForumPosting, Product, Review, FAQPage, QAPage, HowTo, Recipe, Event, Course, Dataset, VideoObject, Movie, TVSeries, SoftwareApplication, Service, CreativeWork]
      # 채워진 필드: 내용 타입 객체에서 필터 후 남은 필드 중 비어 있지 않은 것(@type·@context 제외)
      min_filled_fields: 2
    safety:
      allow:
        # 본문에 있는 사실만으로 JSON-LD를 추가하거나 채운다
        - "Add or complete JSON-LD using only facts in the body."
        # 페이지 내용에 맞는 schema.org 타입을 쓴다
        - "Use a schema.org type that matches the page content."
      forbid:
        # 본문에 없는 평점, 리뷰, 가격, 저자, 날짜
        - "Ratings, reviews, prices, authors, or dates that are not in the body."
        # 잘못된 JSON이나 schema.org에 없는 타입
        - "Invalid JSON or types that are not in schema.org."
    rubric:
      # 엔진에 보이는 JSON-LD가 없다(없거나, 파싱되지 않거나, 필터 후 비어 있다)
      0.0: "No JSON-LD visible to the engine (missing, unparseable, or empty after filtering)."
      # JSON-LD는 보이지만, 채워진 필드가 2개 이상인 내용 타입(Article, Product, FAQPage 등)이 없다
      0.5: "JSON-LD is visible, but no content type (e.g., Article, Product, FAQPage) has at least 2 filled fields."
      # 채워진 필드가 2개 이상인 내용 타입이 하나 이상 있다
      1.0: "At least one content type (e.g., Article, Product, FAQPage) has at least 2 filled fields."

  - id: heading_hierarchy
    name: 헤딩 계층
    name_en: Heading hierarchy
    source: SFE               # STS 우선순위 3위 (heading depth)
    dependency: document
    fields: [structural]
    measure: rule             # 크롤링된 헤딩의 태그 레벨(h1~h6)로 계산. SAGEO는 GE 입력에 태그를 그대로 넣으므로 계층이 엔진에 보인다
    levels: [0, 0.5, 1.0]
    editable: true
    mask_if_absent: false
    rule:
      # SAGEO가 GE에 보여 주는 헤딩만 센다: 헤딩당 500자에서 자르고, 합계 3,500자를 넘는 헤딩부터는 버린다
      visible_view: "SAGEO generator limits: each heading cut at 500 chars; stop adding headings once the total would exceed 3,500 chars"
      # 평평함: 한 레벨만 씀 / 건너뜀: 내려갈 때 레벨을 건너뜀(h2 다음 h4) / h1이 2개 이상
      flat: "only one heading level is used"
      skipped_level: "going down, a level is skipped (e.g., h2 followed by h4)"
      multiple_h1: "more than one h1"
    safety:
      allow:
        # 본문에 이미 있는 섹션의 이름을 붙이는 헤딩을 추가하거나 태그 레벨을 고친다
        - "Add or retag headings that name sections already in the body."
      forbid:
        # 그 섹션에 없는 내용을 약속하는 헤딩
        - "Headings that promise content not in their section."
        # 키워드를 채워 넣은 헤딩
        - "Keyword-stuffed headings."
        # 의미가 바뀌도록 본문 순서를 바꾸기
        - "Reordering body content in a way that changes meaning."
    rubric:
      # 엔진에 보이는 헤딩이 없다
      0.0: "No headings visible to the engine."
      # 헤딩은 있지만 한 레벨만 쓰거나, 내려갈 때 레벨을 건너뛰거나(h2 다음 h4), h1이 2개 이상이다
      0.5: "Headings exist, but only one level is used, a level is skipped going down (e.g., h2 then h4), or there is more than one h1."
      # 두 레벨 이상을 쓰고, 건너뛴 레벨이 없고, h1은 1개 이하다
      1.0: "At least two levels are used, no level is skipped going down, and there is at most one h1."

  - id: upfront_density
    name: 앞부분 정보 밀도
    name_en: Upfront information density
    source: SFE               # STS 우선순위 2위
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # S0(본문 첫 100단어)를 본다. 구체적 사실: 특정 대상의 이름, 쓸모 있는 수치, 핵심 주장 중 하나를 담은 진술.
    # 인사말, 광고, 내비게이션, 상투적 도입부('이 글에서는 ~를 알아보겠습니다')는 사실이 아니다
    definition: "Judge S0 (the first 100 words of the body). A specific fact is a statement that contains a named entity, a usable number, or one of the key claims. Greetings, ads, navigation, and generic openers ('In this article we will...') are not facts."
    # S0가 주제를 밝히나? S0에 구체적 사실이 몇 개 있나?
    judge_question: "Does S0 state the topic? How many specific facts does S0 contain?"
    safety:
      allow:
        # 원문의 핵심 사실을 첫 100단어 안으로 옮긴다
        - "Move existing key facts into the first 100 words."
        # 본문 내용만으로 만든 1~2문장 요약을 맨 앞에 넣는다
        - "Add a 1-2 sentence opening summary built only from the body."
        # 인사말, 광고, 내비게이션, 상투적 도입부를 지운다
        - "Remove greetings, ads, navigation, and generic openers."
      forbid:
        # 본문에 없는 사실을 앞부분에 쓰기
        - "Facts in the opening that the body does not contain."
    rubric:
      # S0가 주제를 밝히지 않는다(인사말, 광고, 내비게이션, 상투적 도입부뿐)
      0.0:  "S0 does not state the topic (only greetings, ads, navigation, or generic openers)."
      # S0가 주제는 밝히지만 구체적 사실이 없다
      0.25: "S0 states the topic but contains no specific fact."
      # S0에 구체적 사실이 1개 있다
      0.5:  "S0 contains 1 specific fact."
      # S0에 구체적 사실이 2개 있다
      0.75: "S0 contains 2 specific facts."
      # S0에 구체적 사실이 3개 이상 있다
      1.0:  "S0 contains 3 or more specific facts."
    # 비고: 질의와 무관한 문서 자체 속성. 질의 종속인 answer_front_loading과 구분

  - id: chunk_independence
    name: 조각 독립성
    name_en: Passage independence
    source: SFE               # + SAGEO-SA "self-contained claims"
    dependency: document
    fields: [body]
    measure: llm_judge
    levels: [0, 0.25, 0.5, 0.75, 1.0]
    editable: true
    mask_if_absent: false
    # 매달린 지칭: 가리키는 대상이 그 구간 안에 없는 표현(예: 'he', 'this method', 'as mentioned above', 'the second one')
    definition: "A dangling reference is an expression whose referent is not inside the segment (e.g., 'he', 'this method', 'as mentioned above', 'the second one')."
    # S1~S4 각각: 그 구간만 읽고도 모든 문장이 무엇에 대한 것인지 알 수 있고, 매달린 지칭이 없나? 통과한 구간 수를 센다
    judge_question: "For each of S1-S4: reading only that segment, can you tell what every sentence is about, with no dangling reference? Count the segments that pass."
    safety:
      allow:
        # 매달린 지칭을 그것이 가리키는 대상의 이름으로 바꾼다
        - "Replace a dangling reference with the name of what it refers to."
        # 섹션 첫머리에서 주어를 다시 밝힌다
        - "Restate the subject at the start of a section."
      forbid:
        # 주장을 바꾸기
        - "Changing claims."
        # 원문에 없는 정보를 담은 요약을 더하기
        - "Adding summaries that contain information not in the original."
    rubric:
      # 매달린 지칭 없이 읽히는 구간이 없다
      0.0:  "No segment can be understood on its own."
      # 4개 구간 중 1개가 혼자 읽힌다
      0.25: "1 of the 4 segments can be understood on its own."
      # 4개 구간 중 2개
      0.5:  "2 of the 4 segments can be understood on their own."
      # 4개 구간 중 3개
      0.75: "3 of the 4 segments can be understood on their own."
      # 4개 구간 모두
      1.0:  "All 4 segments can be understood on their own."

  # ── 구조 · 질의 종속 [Q] ─────────────────────────────────────────

  - id: structural_query_alignment
    name: 구조 필드 질의 정합성 [Q]
    name_en: Structural-field query alignment
    source: SAGEO-SA          # entity mirroring
    dependency: query
    fields: [structural]
    measure: rule             # 질의 핵심어·엔티티가 title/meta/headings/jsonld에 등장하는 비율
                              # (필드 가중치는 SAGEO BM25 필드별 RRF 가중치를 따른다)
    levels: continuous
    editable: true
    mask_if_absent: false
    safety:
      allow:
        # 본문이 다루는 내용에 한해, 질의의 핵심어나 엔티티를 제목·메타 설명·헤딩·JSON-LD에 쓴다
        - "Use the query's key terms or entities in the title, meta description, headings, or JSON-LD where the body covers them."
      forbid:
        # 본문에 없는 엔티티
        - "Entities that are not in the body."
        # 키워드 나열이나 부자연스러운 반복
        - "Keyword lists or unnatural repetition."
    rewriter_bins:
      # 구조 필드에 질의의 핵심어나 엔티티가 없다
      0.0: "The structural fields contain none of the query's key terms or entities."
      # 구조 필드에 질의의 핵심어나 엔티티가 일부 있다
      0.5: "The structural fields contain some of the query's key terms or entities."
      # 구조 필드에 질의의 핵심어와 엔티티가 자연스럽게 모두 들어 있다
      1.0: "The structural fields naturally contain all of the query's key terms and entities."
